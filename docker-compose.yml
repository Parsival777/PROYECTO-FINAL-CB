version: '3.8'

services:
  lab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ciberlab_app
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/var/log/lab
      - /tmp:/tmp:rw
    environment:
      - SECRET_KEY=lab-secret-key-dev-change-in-production
      - FLASK_ENV=development
    networks:
      - ciberlab-network
    restart: unless-stopped

  zap-proxy:
    image: owasp/zap2docker-stable:latest
    container_name: ciberlab_zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./zap-reports:/zap/wrk
    networks:
      - ciberlab-network
    restart: unless-stopped

  # Servicio opcional para logs centralizados
  nginx-proxy:
    image: nginx:alpine
    container_name: ciberlab_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - lab-app
    networks:
      - ciberlab-network
    restart: unless-stopped

networks:
  ciberlab-network:
    driver: bridge