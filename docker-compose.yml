version: '3.8'

services:
  # =====================================================================
  # VERSIÓN VULNERABLE - Puerto 8080 vía Nginx
  # =====================================================================
  vulnerable-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ciberlab_vulnerable_5000
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FLASK_APP=app.py
    volumes:
      - ./lab_app.db:/app/lab_app.db
    expose:
      - "5000"
    networks:
      - ciberlab-network
    security_opt:
      - no-new-privileges:true
    read_only: false

  # =====================================================================
  # VERSIÓN SEGURA - Puerto 8443 vía Nginx (HTTPS recomendado)
  # =====================================================================
  secure-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ciberlab_secure_5001
    command: python app_secure.py
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - FLASK_APP=app_secure.py
      - SECRET_KEY=prod_secret_key_change_me_in_production
    volumes:
      - ./lab_app_secure.db:/app/lab_app_secure.db
      - ./evidencias:/app/evidencias
    expose:
      - "5001"
    networks:
      - ciberlab-network
    security_opt:
      - no-new-privileges:true
    read_only: false

  # =====================================================================
  # NGINX REVERSE PROXY - Punto de entrada único
  # =====================================================================
  nginx:
    image: nginx:alpine
    container_name: ciberlab_nginx
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./evidencias:/var/log/nginx
      - ./nginx-certs:/etc/nginx/certs
    depends_on:
      - vulnerable-app
      - secure-app
    networks:
      - ciberlab-network
    restart: unless-stopped

networks:
  ciberlab-network:
    driver: bridge