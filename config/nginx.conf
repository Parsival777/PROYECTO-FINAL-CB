# =============================================================================
# NGINX CONFIGURATION - Ciberseguridad Tecmi Health
# Escenario: Ransomware Cipherware
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # =========================================================================
    # OCULTAR HUELLA TECNOLÓGICA - Obey OWASP ASVS #14.1.3
    # =========================================================================
    server_tokens off;
    more_clear_headers 'Server';
    
    # =========================================================================
    # FORMATO DE LOGGING ESTRUCTURADO PARA SOC
    # =========================================================================
    log_format security_json escape=json '{'
        '"@timestamp": "$time_iso8601",'
        '"level": "INFO",'
        '"ip": "$remote_addr",'
        '"user": "$remote_user",'
        '"endpoint": "$request_uri",'
        '"method": "$request_method",'
        '"status": $status,'
        '"size": $body_bytes_sent,'
        '"referer": "$http_referer",'
        '"user_agent": "$http_user_agent",'
        '"request_id": "$request_id"'
    '}';
    
    # =========================================================================
    # LIMITACIÓN DE TASA - Prevención de escaneo y fuerza bruta
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Rates para diferentes endpoints
    limit_req_status 429;
    limit_conn_status 429;
    
    # Variables de rate limiting
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # =========================================================================
    # UPSTREAMS - Servicios internos (Flask)
    # =========================================================================
    upstream flask_vulnerable {
        server vulnerable-app:5000;
        keepalive 32;
        keepalive_timeout 30s;
    }
    
    upstream flask_secure {
        server secure-app:5001;
        keepalive 32;
        keepalive_timeout 30s;
    }
    
    # =========================================================================
    # SERVER - Puerto 80 (HTTP) - Acceso público
    # =========================================================================
    server {
        listen 80;
        server_name localhost;
        
        access_log /var/log/nginx/access.log security_json;
        error_log /var/log/nginx/error.log warn;
        
        # Tamaño máximo de carga protegido
        client_max_body_size 1M;
        client_body_timeout 10s;
        client_header_timeout 10s;
        
        # =====================================================================
        # BLOQUEAR MÉTODOS HTTP NO NECESARIOS - OWASP #14.4.1
        # =====================================================================
        if ($request_method !~ ^(GET|POST|PUT|DELETE)$) {
            return 405;
        }
        
        # =====================================================================
        # HEADERS DE SEGURIDAD HTTP - OWASP ASVS #14.3.x
        # =====================================================================
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        
        # =====================================================================
        # REDIRECCIÓN A HTTPS (recomendado en producción)
        # =====================================================================
        # return 301 https://$host$request_uri;
        
        # =====================================================================
        # ENDPOINTS VULNERABLE (Laboratorio para pruebas)
        # =====================================================================
        location /vulnerable/ {
            # Rate limiting agresivo para endpoint vulnerable
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            
            proxy_pass http://flask_vulnerable/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Timeout de proxy
            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # =====================================================================
        # ENDPOINTS SECUROS (Remediados)
        # =====================================================================
        location /secure/ {
            # Rate limiting moderado
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn conn_limit 20;
            
            proxy_pass http://flask_secure/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
        
        # =====================================================================
        # RAÍZ - Página principal redirige a login seguro
        # =====================================================================
        location = / {
            proxy_pass http://flask_secure/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # =====================================================================
        # LOGIN SEGURO - Rate limiting estricto
        # =====================================================================
        location = /login {
            limit_req zone=login_limit burst=5 nodelay;
            limit_conn conn_limit 5;
            
            proxy_pass http://flask_secure/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # =====================================================================
        # API COMUNES - Rate limiting moderado
        # =====================================================================
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            
            proxy_pass http://flask_secure;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # =====================================================================
        # BLOQUEO DE RUTAS NO EXISTENTES - Prevención de enumeración
        # =====================================================================
        location /admin {
            return 404;
        }
        
        location /debug {
            # Solo accesible desde localhost (Docker network)
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://flask_secure/debug;
        }
        
        # =====================================================================
        # MANEJO DE ERRORES PERSONALIZADOS
        # =====================================================================
        error_page 400 /400.html;
        error_page 401 /401.html;
        error_page 403 /403.html;
        error_page 404 /404.html;
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            internal;
            return 404 '{"error": "Recurso no encontrado", "status": 404}';
        }
        
        location = /429.html {
            internal;
            return 429 '{"error": "Demasiadas peticiones", "status": 429}';
        }
        
        location = /50x.html {
            internal;
            return 500 '{"error": "Error interno del servidor", "status": 500}';
        }
    }
    
    # =========================================================================
    # SERVER - Puerto 8443 (HTTPS) - Configuración alternativa
    # =========================================================================
    server {
        listen 8443;
        server_name localhost;
        
        access_log /var/log/nginx/access_ssl.log security_json;
        error_log /var/log/nginx/error_ssl.log warn;
        
        # Cliente máximo 1MB
        client_max_body_size 1M;
        
        if ($request_method !~ ^(GET|POST|PUT|DELETE)$) {
            return 405;
        }
        
        # Headers de seguridad
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        location / {
            proxy_pass http://flask_secure/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}